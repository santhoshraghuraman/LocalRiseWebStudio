<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&amp;display=swap');
      .h-title {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 0.03em;
      }
      .h-sub {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 16.5px;
        letter-spacing: 0.32em;
      }
    </style>

    <radialGradient id="hSun" cx="50%" cy="100%" r="98%" fx="50%" fy="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#FFF2A3" />
      <stop offset="45%" stop-color="#F4B400" />
      <stop offset="85%" stop-color="#E88A00" />
      <stop offset="100%" stop-color="#D96B00" />
    </radialGradient>

    <linearGradient id="hRoad" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0047AB" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="85%" stop-color="#003882" />
      <stop offset="100%" stop-color="#0D1B3D" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group (Transformed & Scaled into 140x140 area) -->
  <g transform="translate(5, 5) scale(0.165)">
    <!-- Sun Rays -->
    <polygon points="500,70 488,270 512,270" fill="#F4B400" />
    <polygon points="404,145 425,282 447,272" fill="#F4B400" />
    <polygon points="341,222 384,306 403,291" fill="#F4B400" />
    <polygon points="290,287 353,342 368,323" fill="#F4B400" />
    <polygon points="253,360 336,388 344,367" fill="#F4B400" />
    <polygon points="180,442 332,434 332,448" fill="#F4B400" />

    <polygon points="596,145 553,272 575,282" fill="#F4B400" />
    <polygon points="659,222 597,291 616,306" fill="#F4B400" />
    <polygon points="710,287 632,323 647,342" fill="#F4B400" />
    <polygon points="747,360 656,367 664,388" fill="#F4B400" />
    <polygon points="820,442 668,448 668,434" fill="#F4B400" />

    <!-- Sun Semicircle -->
    <path d="M 334,440 A 166,166 0 0,1 666,440 Z" fill="url(#hSun)" />
    <ellipse cx="500" cy="440" rx="68" ry="34" fill="#FFFFFF" />

    <!-- Horizon Arc -->
    <path
      d="M 165,565 C 265,440 410,438 500,438 C 590,438 735,440 835,565 C 740,454 590,450 500,450 C 410,450 260,454 165,565 Z"
      fill="#0D1B3D"
    />

    <!-- Road -->
    <path
      d="M 482,442 C 430,458 350,505 320,555 C 290,605 305,660 365,715 C 440,765 520,748 585,746 C 470,725 385,670 376,610 C 368,545 425,480 484,442 Z"
      fill="url(#hRoad)"
    />

    <!-- Growth Arrow -->
    <path
      d="M 506,446 L 570,530 L 536,530 C 532,580 526,630 512,680 C 518,630 522,580 524,530 L 490,530 Z"
      fill="#0D1B3D"
    />

    <!-- Cursor Pointer -->
    <path
      d="M 518,552 L 675,662 L 602,668 L 652,746 L 620,755 L 572,674 L 538,736 Z"
      fill="#0D1B3D"
    />
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(165, 0)">
    <!-- LOCAL RISE -->
    <text x="0" y="74" class="h-title">
      <tspan fill="#0D1B3D">LOCAL </tspan>
      <tspan fill="#F4B400">RISE</tspan>
    </text>

    <!-- — WEB STUDIO — -->
    <line x1="2" y1="102" x2="38" y2="102" stroke="#0D1B3D" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="107" fill="#0D1B3D" class="h-sub">WEB STUDIO</text>
    <line x1="262" y1="102" x2="298" y2="102" stroke="#F4B400" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
