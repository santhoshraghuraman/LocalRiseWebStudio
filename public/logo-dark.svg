<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&amp;display=swap');
      .brand-title-dark {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 106px;
        letter-spacing: 0.04em;
      }
      .brand-subtitle-dark {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: 0.36em;
      }
    </style>

    <radialGradient id="sunGradientDark" cx="50%" cy="100%" r="98%" fx="50%" fy="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#FFC83B" />
      <stop offset="65%" stop-color="#F4B400" />
      <stop offset="88%" stop-color="#E88A00" />
      <stop offset="100%" stop-color="#D96B00" />
    </radialGradient>

    <linearGradient id="roadGradientDark" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#0080FF" />
      <stop offset="85%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="burstRayGradientDark" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="85%" stop-color="#FFF8E0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F4B400" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- External Sun Rays -->
  <polygon points="500,70 488,270 512,270" fill="#F4B400" />
  <polygon points="404,145 425,282 447,272" fill="#F4B400" />
  <polygon points="341,222 384,306 403,291" fill="#F4B400" />
  <polygon points="290,287 353,342 368,323" fill="#F4B400" />
  <polygon points="253,360 336,388 344,367" fill="#F4B400" />
  <polygon points="180,442 332,434 332,448" fill="#F4B400" />

  <polygon points="596,145 553,272 575,282" fill="#F4B400" />
  <polygon points="659,222 597,291 616,306" fill="#F4B400" />
  <polygon points="710,287 632,323 647,342" fill="#F4B400" />
  <polygon points="747,360 656,367 664,388" fill="#F4B400" />
  <polygon points="820,442 668,448 668,434" fill="#F4B400" />

  <!-- Sun Disc -->
  <path d="M 334,440 A 166,166 0 0,1 666,440 Z" fill="url(#sunGradientDark)" />

  <!-- Starburst Rays -->
  <polygon points="500,300 495,440 505,440" fill="url(#burstRayGradientDark)" />
  <polygon points="450,326 490,440 500,440" fill="url(#burstRayGradientDark)" opacity="0.9" />
  <polygon points="550,326 500,440 510,440" fill="url(#burstRayGradientDark)" opacity="0.9" />
  <polygon points="410,368 485,440 496,440" fill="url(#burstRayGradientDark)" opacity="0.85" />
  <polygon points="590,368 504,440 515,440" fill="url(#burstRayGradientDark)" opacity="0.85" />
  <polygon points="380,412 480,440 492,440" fill="url(#burstRayGradientDark)" opacity="0.75" />
  <polygon points="620,412 508,440 520,440" fill="url(#burstRayGradientDark)" opacity="0.75" />

  <!-- Core Glow -->
  <ellipse cx="500" cy="440" rx="68" ry="34" fill="#FFFFFF" />

  <!-- Horizon Arc (White for dark theme) -->
  <path
    d="M 165,565 C 265,440 410,438 500,438 C 590,438 735,440 835,565 C 740,454 590,450 500,450 C 410,450 260,454 165,565 Z"
    fill="#FFFFFF"
  />

  <!-- Ascending Road (Blue) -->
  <path
    d="M 482,442 C 430,458 350,505 320,555 C 290,605 305,660 365,715 C 440,765 520,748 585,746 C 470,725 385,670 376,610 C 368,545 425,480 484,442 Z"
    fill="url(#roadGradientDark)"
  />

  <!-- Growth Arrow (White for dark theme) -->
  <path
    d="M 506,446 L 570,530 L 536,530 C 532,580 526,630 512,680 C 518,630 522,580 524,530 L 490,530 Z"
    fill="#FFFFFF"
  />

  <!-- Cursor Pointer (White for dark theme) -->
  <path
    d="M 518,552 L 675,662 L 602,668 L 652,746 L 620,755 L 572,674 L 538,736 Z"
    fill="#FFFFFF"
  />

  <!-- Typography: LOCAL RISE -->
  <text x="500" y="848" text-anchor="middle" class="brand-title-dark">
    <tspan fill="#FFFFFF">LOCAL </tspan>
    <tspan fill="#F4B400">RISE</tspan>
  </text>

  <!-- — WEB STUDIO — -->
  <line x1="155" y1="894" x2="235" y2="894" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" />
  <text x="500" y="906" text-anchor="middle" fill="#FFFFFF" class="brand-subtitle-dark">WEB STUDIO</text>
  <line x1="765" y1="894" x2="845" y2="894" stroke="#F4B400" stroke-width="4.5" stroke-linecap="round" />
</svg>
