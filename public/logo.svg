<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&amp;display=swap');
      .brand-title {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 106px;
        letter-spacing: 0.04em;
      }
      .brand-subtitle {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 38px;
        letter-spacing: 0.36em;
      }
    </style>

    <!-- Sun Semicircle Radial Gradient -->
    <radialGradient id="sunGradient" cx="50%" cy="100%" r="98%" fx="50%" fy="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="14%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#FFC021" />
      <stop offset="65%" stop-color="#F4B400" />
      <stop offset="85%" stop-color="#E88500" />
      <stop offset="100%" stop-color="#D96500" />
    </radialGradient>

    <!-- Ascending Road Gradient -->
    <linearGradient id="roadGradient" x1="0%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0047AB" />
      <stop offset="30%" stop-color="#005CE6" />
      <stop offset="65%" stop-color="#0070F3" />
      <stop offset="90%" stop-color="#003D99" />
      <stop offset="100%" stop-color="#0D1B3D" />
    </linearGradient>

    <!-- Internal Sun Burst Ray Gradient -->
    <linearGradient id="burstRayGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="85%" stop-color="#FFF8E0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F4B400" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- ==========================================
       1. EXTERNAL SUN RAYS (With clean gap above sun disc)
       ========================================== -->
  <!-- Center Top Ray (Apex vertical ray) -->
  <polygon points="500,70 488,258 512,258" fill="#F4B400" />

  <!-- Left Sun Rays -->
  <polygon points="404,145 435,274 454,264" fill="#F4B400" />
  <polygon points="340,220 388,300 406,286" fill="#F4B400" />
  <polygon points="288,286 348,340 363,322" fill="#F4B400" />
  <polygon points="253,360 326,388 334,368" fill="#F4B400" />
  <!-- Left Horizon Base Wedge Ray -->
  <polygon points="180,442 322,434 322,450" fill="#F4B400" />

  <!-- Right Sun Rays (Symmetrical) -->
  <polygon points="596,145 546,264 565,274" fill="#F4B400" />
  <polygon points="660,220 594,286 612,300" fill="#F4B400" />
  <polygon points="712,286 637,322 652,340" fill="#F4B400" />
  <polygon points="747,360 666,368 674,388" fill="#F4B400" />
  <!-- Right Horizon Base Wedge Ray -->
  <polygon points="820,442 678,450 678,434" fill="#F4B400" />

  <!-- ==========================================
       2. SUN SEMICIRCULAR DISC
       ========================================== -->
  <path d="M 335,440 A 165,165 0 0,1 665,440 Z" fill="url(#sunGradient)" />

  <!-- Sharp Internal White Starburst Rays -->
  <polygon points="500,310 495,440 505,440" fill="url(#burstRayGradient)" />
  <polygon points="452,336 492,440 500,440" fill="url(#burstRayGradient)" opacity="0.9" />
  <polygon points="548,336 500,440 508,440" fill="url(#burstRayGradient)" opacity="0.9" />
  <polygon points="415,376 486,440 496,440" fill="url(#burstRayGradient)" opacity="0.85" />
  <polygon points="585,376 504,440 514,440" fill="url(#burstRayGradient)" opacity="0.85" />
  <polygon points="385,416 480,440 492,440" fill="url(#burstRayGradient)" opacity="0.75" />
  <polygon points="615,416 508,440 520,440" fill="url(#burstRayGradient)" opacity="0.75" />

  <!-- Intense White Center Glow Core -->
  <ellipse cx="500" cy="440" rx="68" ry="32" fill="#FFFFFF" />

  <!-- ==========================================
       3. CURVED HORIZON ARC
       ========================================== -->
  <path
    d="M 165,565 C 265,442 410,440 500,440 C 590,440 735,442 835,565 C 735,454 590,452 500,452 C 410,452 265,454 165,565 Z"
    fill="#0D1B3D"
  />

  <!-- ==========================================
       4. ASCENDING BLUE ROAD / PATHWAY (Left)
       ========================================== -->
  <path
    d="M 482,442 C 430,458 350,505 320,555 C 290,605 305,660 365,715 C 440,765 520,748 585,746 C 470,725 385,670 376,610 C 368,545 425,480 484,442 Z"
    fill="url(#roadGradient)"
  />

  <!-- ==========================================
       5. CENTER UPWARD GROWTH ARROW
       ========================================== -->
  <!-- Triangular Arrowhead & Sweeping Shaft -->
  <path
    d="M 506,446 L 570,530 L 536,530 C 532,580 526,630 512,680 C 518,630 522,580 524,530 L 490,530 Z"
    fill="#0D1B3D"
  />

  <!-- ==========================================
       6. DIGITAL CURSOR (POINTER ARROW ON RIGHT)
       ========================================== -->
  <path
    d="M 518,552 L 675,662 L 602,668 L 652,746 L 620,755 L 572,674 L 538,736 Z"
    fill="#0D1B3D"
  />

  <!-- ==========================================
       7. BRAND TYPOGRAPHY
       ========================================== -->
  <!-- "LOCAL RISE" -->
  <text x="500" y="848" text-anchor="middle" class="brand-title">
    <tspan fill="#0D1B3D">LOCAL </tspan>
    <tspan fill="#F4B400">RISE</tspan>
  </text>

  <!-- "— WEB STUDIO —" -->
  <!-- Left Navy Accent Bar -->
  <line x1="155" y1="894" x2="235" y2="894" stroke="#0D1B3D" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Centered WEB STUDIO -->
  <text x="500" y="906" text-anchor="middle" fill="#0D1B3D" class="brand-subtitle">WEB STUDIO</text>
  
  <!-- Right Orange Accent Bar -->
  <line x1="765" y1="894" x2="845" y2="894" stroke="#F4B400" stroke-width="4.5" stroke-linecap="round" />
</svg>
